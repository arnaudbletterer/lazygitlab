[package]
name = "lazygitlab"
version = "0.6.1"
edition = "2024"

[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(tarpaulin_include)'] }

[dependencies]
crossterm = "0.29.0"
gitlab = "0.1810.0"
ratatui = { version = "0.30.0", features = ["serde"] }
async-trait = "0.1.89"
tokio = {version = "1.51.1" , features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
toml = "0.8.19"
dotenvy = "0.15.7"
serde_json = "1.0.149"
chrono = "0.4.44"
emojis = "0.8.1"
regex = "1.12.3"
ansi-to-tui = "8.0.1"
chrono-humanize = "0.2.3"

[dev-dependencies]
mockito = "1.4.0"
tokio-test = "0.4.3"
wiremock = "0.6.2"
