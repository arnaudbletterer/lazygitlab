name: CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy
        
    - name: Cache cargo registry
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        
    - name: Rustfmt Check
      run: cargo fmt --all -- --check
      
    - name: Clippy Check
      run: cargo clippy --all-targets -- -D warnings
      
    - name: Run Tests (Wiremock)
      shell: bash
      run: |
        status=0
        export INSTA_UPDATE=new
        cargo test --all --no-fail-fast > test.log 2>&1 || status=$?
        for f in tests/snapshots/*.snap.new; do
          [ -e "$f" ] || continue
          diff "${f%.new}" "$f" | head -30 | while IFS= read -r line; do echo "::error::snapshot ${f##*/}: ${line}"; done
        done
        grep -E '^test result|^test .* FAILED' test.log || true
        grep -E '^test .* FAILED|panicked at|^error' -A4 test.log | head -60 | while IFS= read -r line; do echo "::error::${line}"; done
        exit $status
