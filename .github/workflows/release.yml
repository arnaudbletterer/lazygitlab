name: Release

on:
  push:
    tags: [ "v*" ]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-gnu,  archive: tar.gz }
          - { os: macos-latest,   target: aarch64-apple-darwin,      archive: tar.gz }
          - { os: macos-latest,   target: x86_64-apple-darwin,       archive: tar.gz }
          - { os: windows-latest, target: x86_64-pc-windows-msvc,    archive: zip }
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v4

    - uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}

    - name: Build
      run: cargo build --release --locked --target ${{ matrix.target }}

    - name: Package
      shell: bash
      run: |
        name="lazygitlab-${GITHUB_REF_NAME}-${{ matrix.target }}"
        mkdir "$name"
        cp LICENSE README.md CHANGELOG.md theme.toml.example "$name/"
        if [ "${{ matrix.os }}" = windows-latest ]; then
          cp "target/${{ matrix.target }}/release/lazygitlab.exe" "$name/"
          7z a "$name.zip" "$name"
        else
          cp "target/${{ matrix.target }}/release/lazygitlab" "$name/"
          tar czf "$name.tar.gz" "$name"
        fi
        echo "ASSET=$name.${{ matrix.archive }}" >> "$GITHUB_ENV"

    - uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.target }}
        path: ${{ env.ASSET }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/download-artifact@v4
      with:
        path: dist
        merge-multiple: true

    - name: Checksums
      run: cd dist && sha256sum * > SHA256SUMS

    - name: Create the release
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
