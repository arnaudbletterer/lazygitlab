[project]
site_name = "lazygitlab"
site_description = "A fast, feature-rich terminal UI for GitLab"
site_author = "Arnaud Bletterer"
site_url = "https://abletterer.github.io/lazygitlab/"
repo_name = "abletterer/lazygitlab"
repo_url = "https://github.com/abletterer/lazygitlab"
copyright = "Copyright &copy; 2026 Arnaud Bletterer"
extra_css = [
    "stylesheets/extra.css"
]
extra_javascript = [
    "javascripts/version.js"
]

nav = [
    { "Overview" = "index.md" },
    { "Getting Started" = "getting-started.md" },
    { "User Guide" = [
        { "Dashboard" = "user-guide/dashboard.md" },
        { "Code Review" = "user-guide/code-review.md" },
        { "Issues & Boards" = "user-guide/issues-and-boards.md" },
        { "CI/CD Pipelines" = "user-guide/ci-cd.md" },
        { "Repository" = "user-guide/repository.md" }
    ]},
    { "Reference" = [
        { "Keybindings" = "reference/keybindings.md" },
        { "CLI Options" = "reference/cli.md" },
        { "Theming" = "reference/theming.md" }
    ]}
]

[project.theme]
name = "material"
language = "en"
logo = "assets/logo.svg"
favicon = "assets/logo.png"
features = [
    "navigation.instant",
    "navigation.instant.progress",
    "navigation.sections",
    "navigation.path",
    "navigation.top",
    "navigation.tracking",
    "navigation.footer",
    "search.highlight",
    "content.code.copy"
]

[[project.theme.palette]]
scheme = "slate"
primary = "light blue"
accent = "teal"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
scheme = "default"
primary = "light blue"
accent = "teal"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.def_list]
[project.markdown_extensions.footnotes]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.toc]
permalink = true
[project.markdown_extensions.pymdownx.arithmatex]
generic = true
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.emoji]
emoji_generator = "zensical.extensions.emoji.to_svg"
emoji_index = "zensical.extensions.emoji.twemoji"
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.keys]
[project.markdown_extensions.pymdownx.magiclink]
[project.markdown_extensions.pymdownx.mark]
[project.markdown_extensions.pymdownx.smartsymbols]
[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" }
]
[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
combine_header_slug = true
[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true
[project.markdown_extensions.pymdownx.tilde]
[project.markdown_extensions."zensical.extensions.glightbox"]
auto = true
auto_caption = true
width = "100%"


[project.extra]
version = "v0.16.0-4-g6928a8b"
commit = "6928a8b"
is_dirty = true
build_time = "2026-08-30 11:49:41Z"